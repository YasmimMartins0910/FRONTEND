<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Memória - Frutas da Yasmim</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="card-principal">
        <header class="topo">
          <h1>🍓 Jogo da Memória</h1>
          <p>Encontre os pares das frutas</p>
        </header>

        <section class="info-jogo">
          <div class="info">
            <span>Tentativas</span>
            <strong>08</strong>
          </div>

          <div class="info">
            <span>Pares encontrados</span>
            <strong>3/8</strong>
          </div>

          <div class="info">
            <span>Tempo</span>
            <strong>01:24</strong>
          </div>

          <button class="btn-reiniciar">Reiniciar</button>
        </section>

        <section class="tabuleiro">
          <button class="carta fechada">?</button>
          <button class="carta fechada">?</button>
          <button class="carta aberta">🍓</button>
          <button class="carta fechada">?</button>

          <button class="carta aberta">🍉</button>
          <button class="carta fechada">?</button>
          <button class="carta erro">🍇</button>
          <button class="carta fechada">?</button>

          <button class="carta encontrada">🍍</button>
          <button class="carta fechada">?</button>
          <button class="carta aberta">🍒</button>
          <button class="carta fechada">?</button>

          <button class="carta fechada">?</button>
          <button class="carta aberta">🍌</button>
          <button class="carta fechada">?</button>
          <button class="carta encontrada">🍍</button>
        </section>

        <footer class="dica">
          💡 Dica: memorize as frutas antes de clicar novamente.
        </footer>
      </section>
    </main>
  </body>
</html>
